# Fail when this repository's calls to outside services and its
# integrations.json disagree: https://github.com/Sustenaut/integrations
name: integrations

on:
  pull_request:
  merge_group:
  push: { branches: [main] }

permissions:
  contents: read

jobs:
  integrations:
    uses: Sustenaut/integrations/.github/workflows/scan.yml@3cea78eedb85af418921e479a7c68d0d5e7a8f0e # main
