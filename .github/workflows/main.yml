# Written by `pubrules sync` from the ci block of pubrules.json. Do not edit:
# change pubrules.json and run `pubrules sync`.
name: main

on:
  push: { branches: [main] }

permissions:
  contents: read

jobs:
  # Whether an earlier run already passed on this commit's tree: then the
  # jobs it ran are skipped, and nothing here tests less than it did.
  tested:
    name: ci
    uses: Sustenaut/pubrules/.github/workflows/job-tested.yml@36b8b556ff838eb1e24c4e995350f10fdbdf26f3 # v0.45.0
    with: {"workflow": ".github/workflows/pr.yml"}
    permissions:
      actions: read
      contents: read

  checks:
    name: ci
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubrules/.github/workflows/job-service-checks.yml@36b8b556ff838eb1e24c4e995350f10fdbdf26f3 # v0.45.0
    with: {"shellcheck": "check.sh with-secrets"}

  tests:
    name: ci
    needs: [tested]
    if: ${{ needs.tested.outputs.tested != 'true' }}
    uses: Sustenaut/pubrules/.github/workflows/job-service-tests.yml@36b8b556ff838eb1e24c4e995350f10fdbdf26f3 # v0.45.0
    with: {"setup": "python3 -m venv .venv && tests/install-lock .venv/bin/pip", "test": "cd tests && ../.venv/bin/python -m pytest -q"}

  # The one check a ruleset requires: it passes only when every job
  # above succeeded or, where an earlier run already passed on the
  # commit's tree, was skipped for it. None is skipped for not being asked for.
  passed:
    name: ci / passed
    if: always()
    needs: [tested, checks, tests]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e --arg tested "$TESTED" '.tested.result == "success"
            and all(.[]; .result == "success" or (.result == "skipped" and $tested == "true"))' > /dev/null
        env: { RESULTS: '${{ toJSON(needs) }}', TESTED: '${{ needs.tested.outputs.tested }}' }
